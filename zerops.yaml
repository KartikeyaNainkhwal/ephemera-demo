zerops:
  - setup: app
    build:
      base: nodejs@22
      buildCommands:
        - npm install --omit=dev
      deployFiles:
        - ./server.js
        - ./package.json
        - ./node_modules
    run:
      base: nodejs@22
      ports:
        - port: 3000
          httpSupport: true
      start: npm start
